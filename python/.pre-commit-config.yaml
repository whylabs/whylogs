minimum_pre_commit_version: 2.8.0
default_stages: [commit, push, manual]
repos:
  - repo: https://github.com/psf/black
    rev: 23.1a1
    hooks:
      - id: black
        exclude: python/whylogs/core/proto/|python/docs/|python/whylogs/viz/html/|java|python/whylogs/api/logger/experimental/logger
        files: ^(python/whylogs/)
  - repo: https://github.com/pycqa/flake8
    rev: 4.0.1
    hooks:
      - id: flake8
        files: ^(python/whylogs/)
        args:
          - --max-line-length=160
          - --exclude="""\.tox |
            python/build |
            python/dist |
            java |
            \.eggs |
            python/docs/* |
            python/whylogs/core/proto/* |
            python/whylogs/viz/html/* |
            python/whylogs/api/logger/experimental/logger |
            \.venv"""
          - --extend-ignore=E203,W503
          - --max-complexity=20

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--filter-files]
        files: ^(python/whylogs/)
        exclude: python/whylogs/core/proto/|python/docs/|python/whylogs/viz/html/|java|python/whylogs/api/logger/experimental/logger
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v0.942
    hooks:
      - id: mypy
        language: system
        files: ^(python/whylogs/)
        exclude: ^(python/.venv/lib/python3.8/site-packages/polars/ml/torch.py|python/tests/|python/examples/|python/examples/integration/|python/whylogs/core/proto/|python/docs/|python/whylogs/viz/html/|java|python/whylogs/api/logger/experimental/logger)
        verbose: true
        args:
          - --exclude python/.venv
          - -V
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
        files: ^(python/whylogs/)
        exclude: python/tests/|python/whylogs/core/proto/|python/docs/|python/whylogs/viz/html/|java
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: debug-statements
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(.*cfg|.*dockerignore)
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: .bumpversion.cfg|.dockerignore
